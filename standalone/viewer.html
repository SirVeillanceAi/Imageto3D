<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imageto3D viewer</title>
<style>
  html, body { margin: 0; height: 100%; background: #262626; color: #e5e5e5; font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; z-index: 5; top: 0; left: 0; right: 0; height: 42px; box-sizing: border-box; display: flex; gap: 16px;
         align-items: center; padding: 0 14px; background: rgba(0, 0, 0, .6); }
  #bar a, #bar button { color: #ffb070; text-decoration: none; background: none; border: 0; font: inherit; cursor: pointer; padding: 0; white-space: nowrap; }
  #bar button:disabled { color: #888; cursor: default; }
  #name { font-weight: 600; color: #fff; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  #gl { position: absolute; inset: 42px 0 0 0; display: none; }
  #gl babylon-viewer { width: 100%; height: 100%; display: block; }
  #cpu { position: absolute; inset: 42px 0 0 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
         user-select: none; touch-action: none; cursor: grab; }
  #cpu img { max-width: 100%; max-height: calc(100% - 70px); object-fit: contain; pointer-events: none; transition: opacity .15s; }
  #cpu img.busy { opacity: .55; }
  .ctl { display: flex; gap: 10px; align-items: center; }
  .ctl button { background: #3a3a3a; color: #eee; border: 0; border-radius: 6px; padding: 5px 10px; font: inherit; cursor: pointer; }
  #hint { color: #9a9a9a; font-size: 12px; text-align: center; padding: 0 10px; }
  #msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 20px; }
</style>
</head>
<body>
<div id="bar">
  <span id="name">3D viewer</span>
  <button id="mode" type="button"></button>
  <a id="dl">Download</a>
  <a id="sb" target="_blank" rel="noopener">Babylon Sandbox ↗</a>
</div>
<div id="gl"></div>
<div id="cpu">
  <img id="cpuimg" alt="CPU render of the model">
  <div class="ctl">
    <button type="button" data-az="-45">⟲ 45°</button>
    <button type="button" data-el="15">▲</button>
    <span id="ang"></span>
    <button type="button" data-el="-15">▼</button>
    <button type="button" data-az="45">45° ⟳</button>
  </div>
  <div id="hint">Rendered on the server's CPU, so it works without a GPU or WebGL. Drag sideways to turn the model.</div>
</div>
<div id="msg" hidden></div>
<script type="module">
const BABYLON_VIEWER = "https://cdn.jsdelivr.net/npm/@babylonjs/viewer@9.38.0/dist/babylon-viewer.esm.min.js";
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const src = q.get("src") || "";
const msg = (text) => { $("msg").textContent = text; $("msg").hidden = false; };

if (!/^\/glb\/[0-9a-f]{32}\/[^?#]+\.glb$/i.test(src)) {
  msg("No model selected. Open a model from the Imageto3D app.");
} else {
  const name = decodeURIComponent(src.split("/").pop());
  document.title = name + " - Imageto3D viewer";
  $("name").textContent = name;
  $("dl").href = src;
  $("dl").setAttribute("download", name);
  $("sb").href = "https://sandbox.babylonjs.com/?assetUrl=" + encodeURIComponent(location.origin + src);

  const webgl = (() => {
    try { const c = document.createElement("canvas"); return !!(c.getContext("webgl2") || c.getContext("webgl")); }
    catch (e) { return false; }
  })();

  let az = 0, el = 15, pending = null;
  const renderUrl = () => {
    const box = $("cpu").getBoundingClientRect();
    const px = Math.min(box.width, box.height - 70) * (window.devicePixelRatio || 1);
    const size = Math.max(384, Math.min(1024, Math.round(px / 128) * 128));
    return "/glb-render" + src.slice(4) + `?az=${az}&el=${el}&size=${size}`;
  };
  const renderCpu = () => {
    az = ((az % 360) + 360) % 360;
    el = Math.max(-60, Math.min(75, el));
    $("ang").textContent = `${az}° / ${el}°`;
    const url = renderUrl();
    if (pending === url) return;
    pending = url;
    const img = $("cpuimg");
    img.classList.add("busy");
    const next = new Image();
    next.onload = () => { if (pending === url) { img.src = url; img.classList.remove("busy"); } };
    next.onerror = () => { img.classList.remove("busy"); msg("Could not render this model on the CPU."); };
    next.src = url;
  };

  let glLoaded = false;
  async function loadGL() {
    if (glLoaded) return true;
    try {
      await import(BABYLON_VIEWER);
      const v = document.createElement("babylon-viewer");
      v.setAttribute("source", src);
      v.setAttribute("environment-lighting", "auto");
      $("gl").appendChild(v);
      glLoaded = true;
      return true;
    } catch (e) {
      console.error(e);
      return false;
    }
  }

  async function show(mode) {
    if (mode === "gl" && webgl) {
      $("cpu").style.display = "none";
      $("gl").style.display = "block";
      $("mode").textContent = "CPU view";
      $("mode").disabled = false;
      if (!(await loadGL())) {  // CDN blocked or viewer failed: fall back to CPU
        show("cpu");
        $("mode").textContent = "3D viewer failed to load";
        $("mode").disabled = true;
      }
    } else {
      $("gl").style.display = "none";
      $("cpu").style.display = "flex";
      $("mode").textContent = webgl ? "3D view (WebGL)" : "No WebGL here: CPU view";
      $("mode").disabled = !webgl;
      renderCpu();
    }
  }
  $("mode").onclick = () => show($("cpu").style.display === "flex" ? "gl" : "cpu");

  document.querySelectorAll(".ctl button").forEach((b) => b.onclick = () => {
    az += Number(b.dataset.az || 0);
    el += Number(b.dataset.el || 0);
    renderCpu();
  });
  let dragX = null, startAz = 0;
  $("cpu").addEventListener("pointerdown", (e) => { if (e.target.tagName !== "BUTTON") { dragX = e.clientX; startAz = az; } });
  window.addEventListener("pointermove", (e) => {
    if (dragX === null) return;
    const step = Math.round((e.clientX - dragX) / 25) * 15;
    $("ang").textContent = `${(((startAz - step) % 360) + 360) % 360}° / ${el}°`;
  });
  window.addEventListener("pointerup", (e) => {
    if (dragX === null) return;
    const step = Math.round((e.clientX - dragX) / 25) * 15;
    dragX = null;
    if (step) { az = startAz - step; renderCpu(); }
  });

  show(q.get("mode") === "cpu" ? "cpu" : "gl");
}
</script>
</body>
</html>
