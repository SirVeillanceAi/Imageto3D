# Builds the RunPod image and publishes it to GitHub Container Registry on every push to main:
#   ghcr.io/sirveillanceai/imageto3d:latest
name: Build RunPod image

on:
  push:
    branches: [main]
    paths: ["docker/**", "scripts/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/sirveillanceai/imageto3d:latest
            ghcr.io/sirveillanceai/imageto3d:${{ github.sha }}
