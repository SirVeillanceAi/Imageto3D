# Builds both RunPod images and publishes them to GitHub Container Registry on every push to main:
#   ghcr.io/sirveillanceai/imageto3d:latest         (ComfyUI-Easy-Install template)
#   ghcr.io/sirveillanceai/imageto3d-gradio:latest  (standalone Gradio template)
name: Build RunPod image

on:
  push:
    branches: [main]
    paths: ["docker/**", "scripts/**", "standalone/**", ".github/workflows/docker.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - dockerfile: docker/Dockerfile
            image: ghcr.io/sirveillanceai/imageto3d
          - dockerfile: standalone/Dockerfile
            image: ghcr.io/sirveillanceai/imageto3d-gradio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
